<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafiz Photostat & Computer - Digital Business Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #008080;
            --primary-dark: #005f5f;
            --secondary-color: #25d366;
            --text-dark: #2c3e50;
            --text-muted: #666666;
            --bg-light: #f4f7f6;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .vcard-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        .header-banner {
            height: 120px;
            background: linear-gradient(135deg, #008080, #004d4d);
            position: relative;
        }

        .profile-section {
            text-align: center;
            margin-top: -50px;
            padding: 0 20px 20px 20px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            object-fit: cover;
            background-color: #fff;
        }

        .profile-title {
            font-size: 20px;
            font-weight: 700;
            margin-top: 10px;
            color: var(--text-dark);
        }

        .profile-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px 20px;
            flex-wrap: wrap;
        }

        .action-buttons a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .action-buttons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .call { background-color: #007bff; }
        .whatsapp { background-color: #25d366; }
        .facebook { background-color: #1877f2; }
        .youtube { background-color: #ff0000; }
        .instagram { background-color: #e4405f; }
        .email { background-color: #ea4335; }
        .map { background-color: #34a853; }

        /* Custom Horizontal QR & Scan Me Layout */
        .qr-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin: 10px 20px 20px 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .qr-left {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .qr-left img {
            width: 85px;
            height: 85px;
            display: block;
            object-fit: contain;
        }

        .qr-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }

        .qr-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            line-height: 1.3;
        }

        .scan-me-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.25);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .scan-me-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            padding: 12px;
            background: #fafafa;
            border-top: 1px solid #eeeeee;
            font-size: 11px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="vcard-container">
        <!-- Header Banner -->
        <div class="header-banner"></div>

        <!-- Profile Section -->
        <div class="profile-section">
            <img src="profile.png" alt="Logo / Profile" class="profile-img" onerror="this.src='logo.png';">
            <h1 class="profile-title">Hafiz Photostat & Computer</h1>
            <p class="profile-subtitle">Smart Digital Business Card</p>
        </div>

        <!-- Action / Contact Links -->
        <div class="action-buttons">
            <a href="tel:+8801918286191" class="call"><i class="fa fa-phone"></i></a>
            <a href="https://wa.me/8801918286191" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.facebook.com/hafizphotostatandcomputer/" target="_blank" class="facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.youtube.com/@HafizPhotostatandComputer" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/hafizpc1990/" target="_blank" class="instagram"><i class="fab fa-instagram"></i></a>
            <a href="mailto:hafizpc1990@gmail.com" class="email"><i class="fa fa-envelope"></i></a>
            <a href="https://maps.app.goo.gl/kzvoJQ8q9PeUCVji9" target="_blank" class="map"><i class="fa fa-location-dot"></i></a>
        </div>

        <!-- Horizontal QR Code & Scan Me Section -->
        <div class="qr-section">
            <div class="qr-left">
                <img src="qr.png" alt="QR Code">
            </div>
            <div class="qr-right">
                <p class="qr-text">Scan to save contact details</p>
                <a href="qr.png" download="QR_Code.png" class="scan-me-btn">
                    <i class="fa fa-qrcode"></i> Scan Me
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            © Hafiz Photostat & Computer. All rights reserved.
        </div>
    </div>

</body>
</html>
